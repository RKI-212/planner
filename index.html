<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Семестр">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мой семестр — КНИТУ</title>
<style>
:root{
  --bg:#f5f5f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e3de;
  --accent:#2f5bd3; --accent-soft:#e7edfc;
  --lec:#2f5bd3; --lec-bg:#e7edfc;
  --pz:#1f8a5b; --pz-bg:#e3f4ea;
  --lr:#c4651a; --lr-bg:#fbeedf;
  --ksr:#7b47c9; --ksr-bg:#efe7fa;
  --gym:#c23b6b; --gym-bg:#fbe6ee;
  --road:#5b5b55; --road-bg:#eeeeea;
  --warn:#9a6b00; --warn-bg:#fdf3d6;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --card:#1c1c1a; --ink:#ecebe6; --muted:#9d9c95; --line:#2d2d2a;
    --accent:#7d9cff; --accent-soft:#1f2741;
    --lec:#8aa5ff; --lec-bg:#1e2640;
    --pz:#5fcf98; --pz-bg:#16301f;
    --lr:#f0a060; --lr-bg:#35251a;
    --ksr:#b993ff; --ksr-bg:#2a2140;
    --gym:#ff7fa8; --gym-bg:#3a1c27;
    --road:#b9b8b0; --road-bg:#262624;
    --warn:#f2c14e; --warn-bg:#352c13;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 104px calc(14px + env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.odd{background:var(--ksr-bg);color:var(--ksr)}
.chip.even{background:var(--pz-bg);color:var(--pz)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a .ic{display:block;font-size:19px;line-height:1.2;margin-bottom:1px}
nav.tabs a.on{color:var(--accent)}
/* day strip */
.strip{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px;align-items:stretch;margin-bottom:10px}
.strip .arr{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);border-radius:10px}
.strip .d{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0 5px;text-align:center;min-height:62px}
.strip .d .w{font-size:11px;color:var(--muted);text-transform:uppercase}
.strip .d .n{font-size:17px;font-weight:700;margin:1px 0}
.strip .d .dots{display:flex;justify-content:center;gap:3px;height:6px}
.strip .d .dots i{width:6px;height:6px;border-radius:50%;display:block}
.strip .d.today .n{color:var(--accent)}
.strip .d.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.strip .d.sel .w,.strip .d.sel .n{color:#fff}
.strip .d.off{opacity:.55}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 8px}
.dayhead h2{margin:0;font-size:20px;letter-spacing:-.2px}
.todaybtn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:8px;background:var(--accent-soft)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.summary .s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.summary .s b{display:block;font-size:16px}
.status{border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
/* timeline */
.tl{position:relative;margin:0 0 10px}
.it{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:8px}
.it .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:11px;text-align:right}
.it .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.blk{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-left-width:4px}
.blk .t{font-weight:650}
.blk .m{font-size:13px;color:var(--muted);margin-top:2px}
.blk.lec{border-left-color:var(--lec)} .blk.pz{border-left-color:var(--pz)} .blk.lr{border-left-color:var(--lr)} .blk.ksr{border-left-color:var(--ksr)}
.blk.road{background:var(--road-bg);border-color:transparent;border-left-color:var(--road)}
.blk.gap{background:transparent;border-style:dashed;border-left-style:solid;border-left-color:var(--line)}
.blk.gym{background:var(--gym-bg);border-color:transparent;border-left-color:var(--gym)}
.blk.hol{background:var(--warn-bg);border-color:transparent;border-left-color:var(--warn)}
.blk .note{margin-top:6px;font-size:13px;color:var(--warn);background:var(--warn-bg);padding:4px 8px;border-radius:8px;display:inline-block}
.it.past{opacity:.45}
.it.now .blk{box-shadow:0 0 0 2px var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;vertical-align:1px;margin-left:4px}
.badge.lec{background:var(--lec-bg);color:var(--lec)} .badge.pz{background:var(--pz-bg);color:var(--pz)}
.badge.lr{background:var(--lr-bg);color:var(--lr)} .badge.ksr{background:var(--ksr-bg);color:var(--ksr)}
.maplink{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:5px 10px;border-radius:8px;background:var(--accent-soft)}
.live{margin-top:6px;font-size:13px;font-weight:600;padding:5px 9px;border-radius:8px;background:var(--pz-bg);color:var(--pz)}
.live.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:26px 10px}
.empty .big{font-size:34px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  font:inherit;padding:8px 10px;resize:vertical}
/* week */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.wday h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.wl{display:grid;grid-template-columns:22px 86px 1fr;gap:4px 8px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.wl:first-of-type{border-top:0}
.wl .p{font-weight:700;color:var(--muted)}
.wl .tt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.gym{background:var(--gym-bg);color:var(--gym)}
.tag.road{background:var(--road-bg);color:var(--road)}
/* subjects */
.subj h3{margin:0 0 4px;font-size:16px}
.subj ul{margin:6px 0 0;padding-left:18px}
.subj li{margin:2px 0;font-size:14px}
table.k{width:100%;border-collapse:collapse;font-size:14px}
table.k td,table.k th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.k th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
h2.sec{font-size:17px;margin:16px 2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
@media (min-width:700px){ .strip .d{min-height:70px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Мой семестр</h1>

<script>
/* =====================================================================
   ДАННЫЕ. Всё, что может меняться, — здесь.
   ===================================================================== */
const DATA = {
  semester: { from: "2026-09-01", to: "2026-12-31" },
  oddAnchorMonday: "2026-10-26",          // эта неделя — нечётная
  pairs: { 1:["08:00","09:30"], 2:["09:40","11:10"], 3:["11:20","12:50"], 4:["13:00","14:30"],
           5:["14:40","16:10"], 6:["16:20","17:50"], 7:["18:00","19:30"] },
  buildings: {
    "А": { group:"km", park:10, addr:"ул. Карла Маркса, 68", geo:"Казань, улица Карла Маркса, 68" },
    "В": { group:"km", park:10, addr:"ул. Карла Маркса, 72", geo:"Казань, улица Карла Маркса, 72" },
    "Д": { group:"st", park:8,  addr:"Сибирский тракт, 12", geo:"Казань, Сибирский тракт, 12" },

    "Г": { group:"st", park:8,  addr:"ул. Попова, 10 (рядом с Д)", geo:"Казань, улица Попова, 10" }
  },
  // Живое время в пути через API Яндекс Карт (пробки на текущий момент)
  yandex: { apiKey:"ab30aa23-383b-433d-904c-d2e555696faf", home:"Казань, улица Рихарда Зорге, 13В",
            refreshMin:20, windowBeforeMin:180 },
  groupsName: { km:"Карла Маркса", st:"Сибирский тракт" },
  road: { drive:15, drivePeak:25, buffer:5, betweenCampuses:15,
          peaks:[["07:30","09:00"],["16:30","19:00"]], peakDays:[1,2,3,4,5] },
  gym: { name:"«Максимус», ул. Минская, 9", anchor:"2026-10-30", every:2,
         workout:90, after:40, meal:40, driveFromHome:10, park:5,
         overrides: {
           "odd-5":  { start:"09:00", note:"Утром, до выезда в 12:30. Вечером после пар — примерно с 19:20 до 21:30." },
           "even-4": { start:"10:00", note:"Утром, до выезда в 14:10. Вечером после пар — примерно с 19:20." },
           "even-6": { note:"По ситуации: самый плотный день." }
         } },
  // Подписи типов занятий
  types: { "ЛЕКЦ":"lec", "ПЗ":"pz", "ЛР":"lr", "КСР":"ksr" },
  // Расписание: только те пары, на которые вы ходите (1 подгр. по программированию, 2 подгр. по ИБ, английский без спаренной пары)
  schedule: {
    odd: {
      1: [
        { p:1, s:"Основы программирования", t:"ЛЕКЦ", r:"А-Круглый зал", tch:"Проклов Р.С." },
        { p:2, s:"Линейная и векторная алгебра", t:"ЛЕКЦ", r:"А-Круглый зал", tch:"Пауль С.В." },
        { p:3, s:"Информатика", t:"ЛЕКЦ", r:"А-Круглый зал", tch:"Шустрова М.Л." },
        { p:4, s:"Информатика", t:"ЛЕКЦ", r:"А-Круглый зал", tch:"Шустрова М.Л." }
      ],
      3: [
        { p:2, s:"Физкультура (элективные курсы)", t:"ПЗ", r:"М-6(12)", tch:"Пастух Н.М.", to:"2026-12-06" },
        { p:3, s:"Иностранный язык", t:"ПЗ", r:"Г-518", tch:"Волкова Е.В." },
        { p:4, s:"Физика", t:"ЛЕКЦ", r:"Л-209", tch:"Холин К.В." }
      ],
      4: [
        { p:3, s:"Математический анализ", t:"ЛЕКЦ", r:"Д-236", tch:"Михеев А.В." },
        { p:4, s:"Основы российской государственности", t:"ПЗ", r:"Г-412", tch:"Булычев П.М." },
        { p:5, s:"Основы российской государственности", t:"ПЗ", r:"Г-412", tch:"Булычев П.М." }
      ],
      5: [
        { p:4, s:"Информатика", t:"ПЗ", r:"В-302а", tch:"Шустрова М.Л." },
        { p:5, s:"Информатика", t:"ПЗ", r:"В-302а", tch:"Шустрова М.Л." },
        { p:6, s:"Математический анализ", t:"КСР", r:"Л-217", tch:"Михеев А.В.", start:"16:30", from:"2026-10-01",
          note:"Начало в 16:30. Опоздание до ~20 мин допускается (переезд из В)." }
      ],
      6: [
        { p:2, s:"Основы программирования", t:"ЛР", r:"Д-229", tch:"Мухамадиев Р.Р.", note:"1 подгруппа" },
        { p:3, s:"Основы программирования", t:"ЛР", r:"Д-229", tch:"Мухамадиев Р.Р.", note:"1 подгруппа" },
        { p:4, s:"Основы программирования", t:"ЛР", r:"Д-229", tch:"Мухамадиев Р.Р.", note:"1 подгруппа" }
      ]
    },
    even: {
      1: [
        { p:1, s:"Линейная и векторная алгебра", t:"ПЗ", r:"Д-229", tch:"Пауль С.В." },
        { p:2, s:"Линейная и векторная алгебра", t:"ПЗ", r:"Д-229", tch:"Пауль С.В." },
        { p:3, s:"Иностранный язык", t:"ПЗ", r:"Г", tch:"Волкова Е.В.", note:"Аудитория в расписании не указана" }
      ],
      3: [
        { p:2, s:"Физкультура (элективные курсы)", t:"ПЗ", r:"М-6(12)", tch:"Пастух Н.М.", to:"2026-12-06" },
        { p:3, s:"Основы российской государственности", t:"ЛЕКЦ", r:"Л-217", tch:"Тузиков А.Р." }
      ],
      4: [
        { p:5, s:"Математический анализ", t:"ПЗ", r:"Д-504а", tch:"Михеев А.В." },
        { p:6, s:"Математический анализ", t:"ПЗ", r:"Д-504а", tch:"Михеев А.В." }
      ],
      5: [
        { p:4, s:"Линейная и векторная алгебра", t:"ПЗ", r:"Д-229", tch:"Пауль С.В.", from:"2026-11-02" },
        { p:6, s:"Основы информационной безопасности", t:"ЛЕКЦ", r:"Д-236", tch:"Сафиуллина Л.Х." }
      ],
      6: [
        { p:1, s:"Физика", t:"ЛР", r:"Д-110", tch:"Эндерс П.Я., Кадиров Д.М." },
        { p:2, s:"Физика", t:"ЛР", r:"Д-110", tch:"Эндерс П.Я., Кадиров Д.М." },
        { p:5, s:"Основы информационной безопасности", t:"ЛР", r:"В-302а", tch:"Сафиуллина Л.Х.", note:"2 подгруппа" },
        { p:6, s:"Основы информационной безопасности", t:"ЛР", r:"В-302а", tch:"Сафиуллина Л.Х.", note:"2 подгруппа" },
        { p:7, s:"Основы информационной безопасности", t:"ЛР", r:"В-302а", tch:"Сафиуллина Л.Х.", note:"2 подгруппа" }
      ]
    }
  },
  // Особые даты: праздники, отмены, переносы, разовые пары и заметки
  // kind: "holiday" — пар нет; "cancel" — отменить пару p; "add" — разовая пара; "note" — пометка на день
  exceptions: [
    { date:"2026-11-04", kind:"holiday", title:"День народного единства", text:"Государственный выходной — пар нет." },
    { date:"2026-11-06", kind:"note", title:"День Конституции Республики Татарстан",
      text:"В Татарстане это нерабочий день. Уточните, будут ли пары." },
    { date:"2026-12-31", kind:"holiday", title:"Выходной (перенос с 4 января)", text:"Нерабочий день — пар нет." }
  ]
};

/* =====================================================================
   ЛОГИКА
   ===================================================================== */
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const WD_FULL = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const fmt = m => { m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return h+":"+String(mm).padStart(2,"0"); };
const floor5 = m => Math.floor(m/5)*5;
const ceil5 = m => Math.ceil(m/5)*5;
const dur = m => { const h=Math.floor(m/60), mm=m%60; return (h?h+" ч ":"")+(mm?mm+" мин":"").trim() || "0 мин"; };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayNum = d => Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parity(d){
  const w = Math.floor((dayNum(mondayOf(d)) - dayNum(parseISO(DATA.oddAnchorMonday)))/7);
  return (((w%2)+2)%2)===0 ? "odd" : "even";
}
const parityName = p => p==="odd" ? "Нечётная неделя" : "Чётная неделя";
const bOf = room => DATA.buildings[room.trim()[0]] ? room.trim()[0] : "Д";
const isPeak = (min, dow) => DATA.road.peakDays.includes(dow) &&
  DATA.road.peaks.some(([a,b]) => min>=toMin(a) && min<toMin(b));
const inSemester = d => iso(d)>=DATA.semester.from && iso(d)<=DATA.semester.to;
const isGymDay = d => (((dayNum(d)-dayNum(parseISO(DATA.gym.anchor))) % DATA.gym.every)+DATA.gym.every) % DATA.gym.every === 0;

function lessonsFor(d){
  const key = iso(d), dow=d.getDay(), p=parity(d);
  const ex = DATA.exceptions.filter(e=>e.date===key);
  if (!inSemester(d)) return { lessons:[], ex, outside:true };
  if (ex.some(e=>e.kind==="holiday")) return { lessons:[], ex, holiday:true };
  let ls = (DATA.schedule[p][dow]||[]).filter(l => (!l.from||key>=l.from) && (!l.to||key<=l.to));
  const cancelled = ex.filter(e=>e.kind==="cancel").map(e=>e.p);
  ls = ls.filter(l=>!cancelled.includes(l.p));
  ex.filter(e=>e.kind==="add").forEach(e=>ls.push(e.lesson));
  ls = ls.map(l => ({...l, st: toMin(l.start||DATA.pairs[l.p][0]), en: toMin(l.end||DATA.pairs[l.p][1])}))
         .sort((a,b)=>a.st-b.st);
  return { lessons:ls, ex };
}

// склеиваем подряд идущие одинаковые пары
function blocks(ls){
  const out=[];
  ls.forEach(l=>{
    const last=out[out.length-1];
    if (last && last.s===l.s && last.t===l.t && last.r===l.r && l.p===last.pTo+1 && l.st-last.en<=10){
      last.en=l.en; last.pTo=l.p; if (l.note && !last.notes.includes(l.note)) last.notes.push(l.note);
    } else out.push({...l, pFrom:l.p, pTo:l.p, notes: l.note?[l.note]:[]});
  });
  return out;
}

function planDay(d){
  const dow=d.getDay(), info=lessonsFor(d), bl=blocks(info.lessons), R=DATA.road, items=[];
  const plan={ d, dow, parity:parity(d), info, bl, items, gym:null, dep:null, home:null, start:null, end:null };
  if (bl.length){
    const f=bl[0], fb=DATA.buildings[bOf(f.r)];
    let dep=f.st - R.drive - fb.park - R.buffer, drive=R.drive;
    if (isPeak(dep,dow) || isPeak(f.st-fb.park,dow)){ drive=R.drivePeak; dep=f.st - drive - fb.park - R.buffer; }
    dep=floor5(dep); plan.dep=dep; plan.start=f.st;
    items.push({ t:dep, end:f.st, kind:"road", from:"home", to:bOf(f.r), live:"dep", st:f.st, park:fb.park, title:"Выезд из общаги",
      meta:`Корпус ${bOf(f.r)} · ${DATA.groupsName[fb.group]} · ${drive} мин дорога${drive===R.drivePeak?" (час пик)":""} + ${fb.park} мин парковка + ${R.buffer} мин запас` });
    bl.forEach((b,i)=>{
      const cls = DATA.types[b.t]||"pz";
      const pairs = b.pFrom===b.pTo ? `${b.pFrom} пара` : `${b.pFrom}–${b.pTo} пары`;
      items.push({ t:b.st, end:b.en, kind:"lesson", cls, title:b.s, badge:b.t,
        meta:`${pairs} · ${fmt(b.st)}–${fmt(b.en)} · ${b.r} · ${b.tch}`, notes:b.notes });
      const n=bl[i+1];
      if (n){
        const gap=n.st-b.en;
        const g1=DATA.buildings[bOf(b.r)].group, g2=DATA.buildings[bOf(n.r)].group;
        if (g1!==g2 && gap<=40){
          items.push({ t:b.en, end:n.st, kind:"road", from:bOf(b.r), to:bOf(n.r), title:`Переезд: ${DATA.groupsName[g1]} → ${DATA.groupsName[g2]}`,
            meta:`~${R.betweenCampuses} мин + парковка. Между парами ${gap} мин.` });
        } else if (gap>10){
          const pb=DATA.buildings[bOf(b.r)], nb=DATA.buildings[bOf(n.r)];
          const leave=b.en+pb.park; const drv1=isPeak(leave,dow)?R.drivePeak:R.drive; const arrive=leave+drv1;
          let back=n.st-nb.park-R.drive-R.buffer; if (isPeak(back,dow)) back=n.st-nb.park-R.drivePeak-R.buffer; back=floor5(back);
          let meta = `Свободно ${dur(gap)}.`;
          if (back-arrive>=45) meta += ` Можно заехать в общагу: дома ~${fmt(arrive)}–${fmt(back)} (${dur(back-arrive)}), обратно выезд в ${fmt(back)}.`;
          else meta += " Удобнее остаться в вузе.";
          items.push({ t:b.en, end:n.st, kind:"gap", title:"Окно", meta });
        }
      }
    });
    const l=bl[bl.length-1], lb=DATA.buildings[bOf(l.r)];
    const leave=l.en+lb.park, drv=isPeak(leave,dow)?R.drivePeak:R.drive, home=leave+drv;
    plan.end=l.en; plan.home=home;
    items.push({ t:l.en, end:home, kind:"road", from:bOf(l.r), to:"home", title:`Домой — в общаге ~${fmt(home)}`,
      meta:`${lb.park} мин до машины + ${drv} мин дорога${drv===R.drivePeak?" (вечерний час пик)":""}` });
  }
  // зал
  if (isGymDay(d)){
    const G=DATA.gym, key=plan.parity+"-"+dow, ov=bl.length?G.overrides[key]:null, len=G.workout+G.after;
    let st, note;
    if (!bl.length){ st=null; note="Свободный день — в любое удобное время. Нужно ~"+dur(len+2*G.driveFromHome+G.park)+" вместе с дорогой."; }
    else if (ov && ov.start){ st=toMin(ov.start); note=ov.note; }
    else { st=ceil5(plan.home+G.meal+G.driveFromHome+G.park); note=(ov&&ov.note?ov.note+" ":"")+"Сначала общага и обед ("+G.meal+" мин)."; }
    plan.gym={ st, en: st!=null? st+len : null, note };
    items.push({ t: st!=null?st:-1, end: st!=null?st+len:-1, kind:"gym", title:"Зал · "+G.name,
      meta: (st!=null? `${fmt(st)}–${fmt(st+len)} · тренировка ${G.workout} мин + душ/хамам ${G.after} мин. `:"") + note });
  }
  items.sort((a,b)=>a.t-b.t);
  return plan;
}

function updateLive(){
  const box=document.getElementById("statusBox"); if(!box) return;
  const n=nowMin(), plan=planDay(today());
  let msg="";
  document.querySelectorAll(".it[data-t]").forEach(el=>{
    const t=+el.dataset.t, e=+el.dataset.e;
    el.classList.toggle("past", t>=0 && e>0 && e<=n);
    el.classList.toggle("now", t>=0 && t<=n && n<e);
  });
  const cur=plan.items.find(it=>it.t>=0 && it.t<=n && n<it.end);
  const next=plan.items.find(it=>it.t>n);
  if (cur && cur.kind==="lesson") msg=`Сейчас: ${cur.title} — до ${fmt(cur.end)}`;
  else if (next && next.live==="dep"){ const ld=liveDep(next); const t=ld!=null?ld:next.t;
    msg = t<=n ? `Пора выезжать! (по Яндексу — в ${fmt(t)})` : `Выезд через ${dur(t-n)} — в ${fmt(t)}${ld!=null?" (по пробкам Яндекса)":""}`; }
  else if (cur && cur.kind==="gap") msg=`Окно до ${fmt(cur.end)}`;
  else if (cur && cur.kind==="gym") msg=`Зал до ${fmt(cur.end)}`;
  else if (next) msg=`Дальше: ${next.title} в ${fmt(next.t)}`;
  else if (plan.bl.length) msg="На сегодня пары закончились";
  box.innerHTML = msg ? `<div class="status">${esc(msg)}</div>` : "";
}

/* ===== Живое время через Яндекс ===== */
const LIVE = { loading:null, ok:false, res:{}, last:0, err:"" };
const Y = DATA.yandex;
const addrOf = k => k==="home" ? Y.home : DATA.buildings[k].geo;
function mapUrl(from,to){
  return "https://yandex.ru/maps/?rtext="+encodeURIComponent(addrOf(from))+"~"+encodeURIComponent(addrOf(to))+"&rtt=auto";
}
function loadYmaps(){
  if (LIVE.loading) return LIVE.loading;
  LIVE.loading = new Promise((ok,fail)=>{
    if (!Y.apiKey) return fail(new Error("нет ключа"));
    const sc=document.createElement("script");
    sc.src="https://api-maps.yandex.ru/2.1/?apikey="+encodeURIComponent(Y.apiKey)+"&lang=ru_RU";
    sc.onload=()=>window.ymaps ? ymaps.ready(()=>ok(window.ymaps)) : fail(new Error("API не загрузилось"));
    sc.onerror=()=>fail(new Error("нет связи с Яндексом"));
    document.head.appendChild(sc);
  });
  LIVE.loading.catch(()=>{ LIVE.loading=null; });
  return LIVE.loading;
}
function routeMin(from,to){
  return loadYmaps().then(ym=>new Promise((ok,fail)=>{
    const m=new ym.multiRouter.MultiRouteModel([addrOf(from),addrOf(to)],{routingMode:"auto"});
    const t=setTimeout(()=>fail(new Error("таймаут")),15000);
    m.events.add("requestsuccess",()=>{ clearTimeout(t);
      const r=m.getRoutes()[0]; if(!r) return fail(new Error("маршрут не найден"));
      const p=r.properties.get("durationInTraffic")||r.properties.get("duration");
      ok(Math.round(p.value/60)); });
    m.events.add("requestfail",e=>{ clearTimeout(t); fail(new Error("ошибка маршрута")); });
  }));
}
const liveKey = it => it.from+">"+it.to;
function liveFresh(it){ const r=LIVE.res[liveKey(it)]; return r && (Date.now()-r.at) < (Y.refreshMin+10)*60000 ? r : null; }
function liveDep(it){ const r=liveFresh(it); return r && it.live==="dep" ? Math.floor(it.st - r.min - it.park - DATA.road.buffer) : null; }
function inLiveWindow(it){ const n=nowMin(); return n>=it.t-Y.windowBeforeMin && n<=it.end; }
function liveHtml(it, isToday){
  if (!isToday || !inLiveWindow(it)) return "";
  const r=liveFresh(it);
  if (!r) return LIVE.err ? `<div class="live warn">Яндекс недоступен: ${esc(LIVE.err)}. Считаю по обычному времени.</div>` : `<div class="live">Узнаю время у Яндекса…</div>`;
  const at=new Date(r.at), upd=at.getHours()+":"+String(at.getMinutes()).padStart(2,"0");
  if (it.live==="dep"){
    const ld=liveDep(it), diff=it.t-ld;
    return `<div class="live${diff>0?" warn":""}">Яндекс сейчас: ${r.min} мин в пути → выезжайте в ${fmt(ld)}${diff>0?` (на ${diff} мин раньше)`:diff<0?` (можно на ${-diff} мин позже)`:""} · обновлено ${upd}</div>`;
  }
  return `<div class="live">Яндекс сейчас: ${r.min} мин в пути · обновлено ${upd}</div>`;
}
function refreshLive(force){
  if (!force && Date.now()-LIVE.last < 5*60000) return;
  if (navigator.onLine===false) return;
  const items=planDay(today()).items.filter(it=>it.from && inLiveWindow(it));
  if (!items.length) return;
  LIVE.last=Date.now();
  Promise.all(items.map(it=>routeMin(it.from,it.to).then(min=>{ LIVE.res[liveKey(it)]={min, at:Date.now()}; LIVE.err=""; })
    .catch(e=>{ LIVE.err=e.message||"ошибка"; })))
    .then(()=>{ if((location.hash||"#day")==="#day" && dayNum(state.sel)===dayNum(today())) renderDay(); });
}

function route(){
  const v=(location.hash||"#day").slice(1);
  const valid=["day","week","subjects","info"].includes(v)?v:"day";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on", a.dataset.v===valid));
  ({day:renderDay, week:renderWeek, subjects:renderSubjects, info:renderInfo})[valid]();
  const p=parity(today()); const c=document.getElementById("parityChip");
  c.className="chip "+p; c.textContent=parityName(p);
  window.scrollTo(0,0);
}

view.addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"), sh=e.target.closest("[data-shift]"), par=e.target.closest("[data-par]");
  if (sh){ state.sel=addDays(state.sel, +sh.dataset.shift); renderDay(); return; }
  if (par){ state.weekParity=par.dataset.par; renderWeek(); return; }
  if (go){ state.sel=parseISO(go.dataset.go); if (location.hash!=="#day"&&location.hash!==""){ location.hash="day"; } else renderDay(); }
});
// свайп по дням
let tx=null;
view.addEventListener("touchstart", e=>{ if((location.hash||"#day")==="#day" && !e.target.closest("textarea")) tx=e.touches[0].clientX; }, {passive:true});
view.addEventListener("touchend", e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if (Math.abs(dx)>70){ state.sel=addDays(state.sel, dx<0?1:-1); renderDay(); } }, {passive:true});
window.addEventListener("hashchange", route);
setInterval(()=>{ if((location.hash||"#day")==="#day") updateLive(); }, 30000);
setInterval(()=>refreshLive(true), DATA.yandex.refreshMin*60000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refreshLive(false); });
setTimeout(()=>refreshLive(true), 300);
route();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
