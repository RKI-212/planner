<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Семестр">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мой семестр — КНИТУ</title>
<style>
:root{
  --bg:#f5f5f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e3de;
  --accent:#2f5bd3; --accent-soft:#e7edfc;
  --lec:#2f5bd3; --lec-bg:#e7edfc;
  --pz:#1f8a5b; --pz-bg:#e3f4ea;
  --lr:#c4651a; --lr-bg:#fbeedf;
  --ksr:#7b47c9; --ksr-bg:#efe7fa;
  --gym:#c23b6b; --gym-bg:#fbe6ee;
  --road:#5b5b55; --road-bg:#eeeeea;
  --warn:#9a6b00; --warn-bg:#fdf3d6;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --card:#1c1c1a; --ink:#ecebe6; --muted:#9d9c95; --line:#2d2d2a;
    --accent:#7d9cff; --accent-soft:#1f2741;
    --lec:#8aa5ff; --lec-bg:#1e2640;
    --pz:#5fcf98; --pz-bg:#16301f;
    --lr:#f0a060; --lr-bg:#35251a;
    --ksr:#b993ff; --ksr-bg:#2a2140;
    --gym:#ff7fa8; --gym-bg:#3a1c27;
    --road:#b9b8b0; --road-bg:#262624;
    --warn:#f2c14e; --warn-bg:#352c13;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 104px calc(14px + env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.odd{background:var(--ksr-bg);color:var(--ksr)}
.chip.even{background:var(--pz-bg);color:var(--pz)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a .ic{display:block;font-size:19px;line-height:1.2;margin-bottom:1px}
nav.tabs a.on{color:var(--accent)}
/* day strip */
.strip{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px;align-items:stretch;margin-bottom:10px}
.strip .arr{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);border-radius:10px}
.strip .d{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0 5px;text-align:center;min-height:62px}
.strip .d .w{font-size:11px;color:var(--muted);text-transform:uppercase}
.strip .d .n{font-size:17px;font-weight:700;margin:1px 0}
.strip .d .dots{display:flex;justify-content:center;gap:3px;height:6px}
.strip .d .dots i{width:6px;height:6px;border-radius:50%;display:block}
.strip .d.today .n{color:var(--accent)}
.strip .d.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.strip .d.sel .w,.strip .d.sel .n{color:#fff}
.strip .d.off{opacity:.55}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 8px}
.dayhead h2{margin:0;font-size:20px;letter-spacing:-.2px}
.todaybtn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:8px;background:var(--accent-soft)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.summary .s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.summary .s b{display:block;font-size:16px}
.status{border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
/* timeline */
.tl{position:relative;margin:0 0 10px}
.it{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:8px}
.it .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:11px;text-align:right}
.it .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.blk{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-left-width:4px}
.blk .t{font-weight:650}
.blk .m{font-size:13px;color:var(--muted);margin-top:2px}
.blk.lec{border-left-color:var(--lec)} .blk.pz{border-left-color:var(--pz)} .blk.lr{border-left-color:var(--lr)} .blk.ksr{border-left-color:var(--ksr)}
.blk.road{background:var(--road-bg);border-color:transparent;border-left-color:var(--road)}
.blk.gap{background:transparent;border-style:dashed;border-left-style:solid;border-left-color:var(--line)}
.blk.gym{background:var(--gym-bg);border-color:transparent;border-left-color:var(--gym)}
.blk.hol{background:var(--warn-bg);border-color:transparent;border-left-color:var(--warn)}
.blk .note{margin-top:6px;font-size:13px;color:var(--warn);background:var(--warn-bg);padding:4px 8px;border-radius:8px;display:inline-block}
.it.past{opacity:.45}
.it.now .blk{box-shadow:0 0 0 2px var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;vertical-align:1px;margin-left:4px}
.badge.lec{background:var(--lec-bg);color:var(--lec)} .badge.pz{background:var(--pz-bg);color:var(--pz)}
.badge.lr{background:var(--lr-bg);color:var(--lr)} .badge.ksr{background:var(--ksr-bg);color:var(--ksr)}
.maplink{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:5px 10px;border-radius:8px;background:var(--accent-soft)}
.live{margin-top:6px;font-size:13px;font-weight:600;padding:5px 9px;border-radius:8px;background:var(--pz-bg);color:var(--pz)}
.live.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:26px 10px}
.empty .big{font-size:34px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  font:inherit;padding:8px 10px;resize:vertical}
/* week */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.wday h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.wl{display:grid;grid-template-columns:22px 86px 1fr;gap:4px 8px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.wl:first-of-type{border-top:0}
.wl .p{font-weight:700;color:var(--muted)}
.wl .tt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.gym{background:var(--gym-bg);color:var(--gym)}
.tag.road{background:var(--road-bg);color:var(--road)}
/* subjects */
.subj h3{margin:0 0 4px;font-size:16px}
.subj ul{margin:6px 0 0;padding-left:18px}
.subj li{margin:2px 0;font-size:14px}
table.k{width:100%;border-collapse:collapse;font-size:14px}
table.k td,table.k th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.k th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
h2.sec{font-size:17px;margin:16px 2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}

/* ---- задачи ---- */
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:10px 0 4px}
.sub.warnc{color:var(--warn)} .sub.link{color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px;margin:0}
a.link{color:var(--accent);text-decoration:none;font-weight:600}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sub+.task{border-top:0}
.tstat{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.tstat:active{transform:scale(.85)}
.tstat.lab.s1{border-color:var(--lr);color:var(--lr)} .tstat.lab.s2{border-color:var(--ksr);color:var(--ksr)}
.tstat.s3.lab,.tstat.hw.s1,.tstat.other.s1{background:var(--pz);border-color:var(--pz);color:#fff}
.tbody{flex:1;min-width:0} .tt1{font-weight:600} .tt2{font-size:12.5px;color:var(--muted)}
.task.done .tt1{text-decoration:line-through;color:var(--muted)}
.task.late .tt2{color:var(--warn)}
.tdel{flex:none;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:20px}
.hero{display:flex;align-items:center;gap:14px}
.hero .big{font-size:40px;font-weight:800;color:var(--accent);min-width:60px;text-align:center;letter-spacing:-1px}
.srow{display:flex;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:14px} .srow:first-child{border-top:0}
.srow span:first-child{min-width:80px;color:var(--muted)}
.labrow{padding:6px 0} .bar{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lr),var(--pz));border-radius:99px;transition:width .6s}
.addf{display:flex;flex-direction:column;gap:8px}
.addf select,.addf input[type=text],.addf input:not([type]),.exform input,input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.duerow{flex-wrap:wrap;gap:10px;font-size:14px} .duerow input[type=date]{flex:1;min-width:150px}
.seg.mini{margin:0} .seg.mini button{padding:6px}
.primary{background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:10px 14px;text-align:center}
.primary.ghost{background:var(--accent-soft);color:var(--accent);flex:1}
.primary.block{display:block;text-decoration:none;margin:10px 0}
.filebtn{cursor:pointer}
details.subj summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
details.subj summary::-webkit-details-marker{display:none}
.steps{padding-left:18px;margin:6px 0 8px} .steps li{margin:3px 0}
code{font-size:12px;word-break:break-all;background:var(--bg);padding:1px 4px;border-radius:4px}
.copy{color:var(--accent);font-weight:600;font-size:12px}
h2.sec.first{margin-top:4px}
/* ---- зал ---- */
.gymbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gb{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.gb.on{background:var(--gym);border-color:var(--gym);color:#fff}
.gb.miss.on{background:var(--muted);border-color:var(--muted)}
.gb.link{color:var(--gym);border-color:transparent;background:transparent}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gs{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.gs b{display:block;font-size:26px;color:var(--gym);letter-spacing:-.5px} .gs b small{font-size:14px;color:var(--muted)}
.gs span{font-size:12px;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.gw{font-size:11px;color:var(--muted);text-align:center}
.gc{aspect-ratio:1;border-radius:9px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:default}
.gc.ok{background:var(--gym);color:#fff;font-weight:700;cursor:pointer}
.gc.miss{background:var(--line);color:var(--muted);text-decoration:line-through;cursor:pointer}
.gc.unk{border:2px dashed var(--gym);color:var(--gym);cursor:pointer}
.gc.old{opacity:.5}
.gc.plan{background:var(--gym-bg);color:var(--gym);cursor:pointer}
.gc.today{box-shadow:inset 0 0 0 2px var(--accent)} .gc.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg.ok{background:var(--gym)} .lg.miss{background:var(--line)} .lg.unk{border:2px dashed var(--gym)} .lg.plan{background:var(--gym-bg)}
.exlist{margin-top:8px} .ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.exform{display:flex;flex-direction:column;gap:6px;margin:8px 0} .exform .row input{flex:1;min-width:0}
.hist{cursor:pointer}
/* ---- анимации ---- */
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:50;overflow:hidden;background:#020306;transition:opacity .7s ease;contain:strict}
#splash.out{opacity:0}
#splash .stage{position:absolute;left:50%;top:50%;width:max(100vw,50vh);height:max(100vh,200vw);transform:translate(-50%,-50%)}
#splash .cam{position:absolute;inset:0;opacity:0;will-change:transform,opacity;transform:translate3d(0,2%,0) scale(1.02);backface-visibility:hidden}
#splash.go .cam{animation:camIn 3.2s cubic-bezier(.25,.1,.25,1) forwards}
@keyframes camIn{0%{opacity:0;transform:translate3d(0,3%,0) scale(1.02)}25%{opacity:1}100%{opacity:1;transform:translate3d(0,-1%,0) scale(1.14)}}
#splash .ly{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#splash .la,#splash .lb{opacity:0;will-change:opacity}
#splash.go .la{animation:winOn .9s ease-out .45s forwards} #splash.go .lb{animation:winOn .9s ease-out 1s forwards}
@keyframes winOn{0%{opacity:0}30%{opacity:.65}42%{opacity:.25}100%{opacity:1}}
#splash .avi{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#ff3030;box-shadow:0 0 6px 2px rgba(255,40,40,.7);opacity:0;will-change:opacity}
#splash.go .avi{animation:avi 1.4s ease-in-out .6s infinite}
#splash.go .a1{animation-delay:1.05s} #splash.go .a2{animation-delay:1.5s}
@keyframes avi{0%,100%{opacity:.1}45%,55%{opacity:1}}
#splash .car{position:absolute;top:69.3%;width:3.5%;height:.25%;border-radius:2px;will-change:transform;opacity:.9}
#splash .c1{left:-6%;background:#ffe2a8;box-shadow:0 0 6px #ffcf7a} #splash .c2{left:100%;top:69.6%;background:#ff4646;box-shadow:0 0 6px #ff3030}
#splash.go .c1{animation:carR 2.6s linear .5s infinite} #splash.go .c2{animation:carL 3.1s linear .8s infinite}
@keyframes carR{to{transform:translate3d(3000%,0,0)}} @keyframes carL{to{transform:translate3d(-3200%,0,0)}}
#splash .fog{position:absolute;left:-50%;width:200%;height:40%;top:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(120,135,160,.2),rgba(120,135,160,0) 70%);will-change:transform;animation:fog 9s ease-in-out infinite alternate;pointer-events:none}
#splash .fog.f2{top:28%;height:30%;opacity:.7;animation-duration:12s;animation-direction:alternate-reverse}
@keyframes fog{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,0,0)}}
#splash .rain{position:absolute;inset:0;overflow:hidden;opacity:.5;pointer-events:none}
#splash .rl{position:absolute;left:-20%;right:-20%;top:-160px;bottom:0;background-image:repeating-linear-gradient(103deg,rgba(170,190,220,0) 0 7px,rgba(170,190,220,.18) 7px 8px,rgba(170,190,220,0) 8px 19px);background-size:120px 160px;will-change:transform;animation:rain .4s linear infinite}
@keyframes rain{from{transform:translate3d(0,0,0)}to{transform:translate3d(-36.9px,160px,0)}}
#splash .bolt{position:absolute;inset:0;background:radial-gradient(80% 50% at 70% 10%,rgba(190,210,255,.55),rgba(190,210,255,0) 70%);opacity:0;will-change:opacity;pointer-events:none}
#splash.go .bolt{animation:bolt 3.2s linear forwards}
@keyframes bolt{0%,44%{opacity:0}45%{opacity:.9}47%{opacity:.15}49%{opacity:.7}53%{opacity:0}100%{opacity:0}}
#splash .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%);pointer-events:none}
#splash.still *{animation:none!important} #splash.still .cam,#splash.still .la,#splash.still .lb{opacity:1}
/* пропуски, бензин */
nav.tabs a{font-size:10.5px;padding:8px 1px 9px;white-space:nowrap}
.infobtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:17px;margin-left:6px}
.infobtn.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.attbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ab{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--pz-bg);color:var(--pz)}
.ab.miss{background:var(--gym);color:#fff} .ab.exc{background:var(--warn-bg);color:var(--warn)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-size:14px;line-height:1.6}
.limrow{gap:10px;margin-top:8px} .limrow input{width:60px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px;margin-left:4px}
.subjabs details{margin-top:6px} .absrow{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)} .absrow em{font-style:normal;color:var(--warn);font-weight:600}
.monthsw{margin:0 2px 10px} .monthsw b{font-size:17px} .monthsw .arr{font-size:22px;color:var(--muted);width:36px;height:32px}
.row.g2{gap:8px} .row.g2 > *{flex:1;min-width:0}
.addf input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.cfggrid{display:grid;gap:8px;margin:10px 0} .cfggrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.cfggrid input{width:80px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.fuelf{display:flex;flex-direction:column;gap:10px}
.fuelf input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.wheelwrap{position:relative;height:220px;border-radius:12px;background:var(--bg);overflow:hidden}
.wheel{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
